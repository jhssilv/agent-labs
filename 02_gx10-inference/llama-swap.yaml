# One model loaded at a time: a request for another model unloads the current one.
# Cold start takes ~1-2 min; requests wait for it.
healthCheckTimeout: 900
# Unload after 15 idle minutes: jobs queued back to back keep the model loaded.
globalTTL: 900

models:
  gpt-oss-120b:
    proxy: http://127.0.0.1:${PORT}
    # 0.7 of the unified pool: ~66 GiB weights + KV cache; the rest stays for agents and observers.
    # fastsafetensors loads the weights in ~15 s; the default mmap loader took ~485 s here.
    cmd: |
      docker run --name ${MODEL_ID} --init --rm --gpus all --ipc=host
      -p 127.0.0.1:${PORT}:8000
      -v /srv/models/hf:/root/.cache/huggingface
      -v /srv/models/vllm-cache:/root/.cache/vllm
      -e HF_HUB_OFFLINE=1
      nvcr.io/nvidia/vllm:26.09-py3
      vllm serve openai/gpt-oss-120b
      --served-model-name gpt-oss-120b
      --load-format fastsafetensors
      --gpu-memory-utilization 0.7
      --enable-auto-tool-choice --tool-call-parser openai
    cmdStop: docker stop ${MODEL_ID}
    unloadTimeout: 60
    # The default (10) answers 429 past it; batches of parallel agents need more.
    concurrencyLimit: 256

  # Flags from the model card's DGX Spark recipe, with the native MTP head instead
  # of the LiLiCorr drafter: that recipe serves a single sequence. Text only: with
  # video enabled, startup profiles a 1M-token video and the engine dies there.
  nemotron-3.5-super:
    proxy: http://127.0.0.1:${PORT}
    cmd: |
      docker run --name ${MODEL_ID} --init --rm --gpus all --ipc=host
      -p 127.0.0.1:${PORT}:8000
      -v /srv/models/hf:/root/.cache/huggingface
      -v /srv/models/vllm-cache:/root/.cache/vllm
      -e HF_HUB_OFFLINE=1
      vllm/vllm-openai:v0.32.0
      nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
      --served-model-name nemotron-3.5-super
      --trust-remote-code
      --load-format fastsafetensors
      --gpu-memory-utilization 0.75
      --max-num-batched-tokens 8192
      --block-size 64 --prefix-match-unit 64
      --mamba-backend flashinfer --mamba-ssm-cache-dtype float16
      --enable-mamba-cache-stochastic-rounding --mamba-cache-philox-rounds 5
      --enable-mamba-shared-prefix-checkpoint
      --limit-mm-per-prompt '{"image":0,"video":0}'
      --speculative-config.method mtp --speculative-config.num_speculative_tokens 5
      --enable-auto-tool-choice --tool-call-parser qwen3_coder
      --reasoning-parser nemotron_v3
    cmdStop: docker stop ${MODEL_ID}
    unloadTimeout: 60
    concurrencyLimit: 256

  # Flags from the model card's DGX Spark recipe, without its --max-num-seqs 4.
  qwen3.6-35b-a3b:
    proxy: http://127.0.0.1:${PORT}
    cmd: |
      docker run --name ${MODEL_ID} --init --rm --gpus all --ipc=host
      -p 127.0.0.1:${PORT}:8000
      -v /srv/models/hf:/root/.cache/huggingface
      -v /srv/models/vllm-cache:/root/.cache/vllm
      -e HF_HUB_OFFLINE=1
      vllm/vllm-openai:v0.32.0
      nvidia/Qwen3.6-35B-A3B-NVFP4
      --served-model-name qwen3.6-35b-a3b
      --trust-remote-code
      --load-format fastsafetensors
      --gpu-memory-utilization 0.7
      --kv-cache-dtype fp8 --attention-backend flashinfer --moe-backend marlin
      --max-num-batched-tokens 8192
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      --enable-auto-tool-choice --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
    cmdStop: docker stop ${MODEL_ID}
    unloadTimeout: 60
    concurrencyLimit: 256

  qwen3.5-4b:
    proxy: http://127.0.0.1:${PORT}
    cmd: |
      docker run --name ${MODEL_ID} --init --rm --gpus all --ipc=host
      -p 127.0.0.1:${PORT}:8000
      -v /srv/models/hf:/root/.cache/huggingface
      -v /srv/models/vllm-cache:/root/.cache/vllm
      -e HF_HUB_OFFLINE=1
      vllm/vllm-openai:v0.32.0
      Qwen/Qwen3.5-4B
      --served-model-name qwen3.5-4b
      --load-format fastsafetensors
      --gpu-memory-utilization 0.15
      --max-model-len 32768
      --limit-mm-per-prompt '{"image":0,"video":0}'
      --enable-prefix-caching
      --reasoning-parser qwen3
    cmdStop: docker stop ${MODEL_ID}
    unloadTimeout: 60
    concurrencyLimit: 256

  qwen3.5-2b:
    proxy: http://127.0.0.1:${PORT}
    cmd: |
      docker run --name ${MODEL_ID} --init --rm --gpus all --ipc=host
      -p 127.0.0.1:${PORT}:8000
      -v /srv/models/hf:/root/.cache/huggingface
      -v /srv/models/vllm-cache:/root/.cache/vllm
      -e HF_HUB_OFFLINE=1
      vllm/vllm-openai:v0.32.0
      Qwen/Qwen3.5-2B
      --served-model-name qwen3.5-2b
      --load-format fastsafetensors
      --gpu-memory-utilization 0.1
      --max-model-len 32768
      --limit-mm-per-prompt '{"image":0,"video":0}'
      --enable-prefix-caching
      --reasoning-parser qwen3
    cmdStop: docker stop ${MODEL_ID}
    unloadTimeout: 60
    concurrencyLimit: 256
